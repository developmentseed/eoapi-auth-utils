[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.version]
path = "eoapi/auth_utils/__init__.py"
source = "file"

[tool.pdm.build]
excludes = ["tests/", "**/.mypy_cache", "**/.DS_Store"]
includes = ["eoapi"]

[project]
authors = [
  {name = "Anthony Lukach", email = "anthony@developmentseed.org"},
]
dependencies = [
  "cryptography>=50.0.2",
  "fastapi>=0.143.0",
  "pyjwt>=2.15.1",
]
description = "Authentication & authorization helpers for eoAPI"
dynamic = ["version"]
license = {file = "LICENSE"}
name = "eoapi-auth-utils"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
lint = [
  "pre-commit>=4.6.2",
]
testing = [
  "coverage>=7.16.2",
  "httpx2>=2.13.1",
  "jwcrypto>=1.6.1",
  "pytest>=9.1.1",
  "pytest-httpserver>=1.2.0",
]

[tool.mypy]
no_implicit_optional = true
strict_optional = true
namespace_packages = true
explicit_package_bases = true

